[package]
name = "glidedeck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GlideDeck: a local-first, native zooming presentation tool."
build = "build.rs"

[[bin]]
name = "glidedeck"
path = "src/main.rs"

[dependencies]
glide-core.workspace = true
glide-render.workspace = true
glide-pptx.workspace = true
anyhow.workspace = true
arboard.workspace = true
egui-phosphor.workspace = true
image.workspace = true
clap.workspace = true
eframe.workspace = true
glam.workspace = true
log.workspace = true
png.workspace = true
rfd.workspace = true
roxmltree = "0.21"
unicode-bidi = "0.3"
serde.workspace = true
serde_json.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"

[dev-dependencies]
egui_kittest.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
